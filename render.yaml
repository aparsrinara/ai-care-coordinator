services:
  - type: web
    name: care-coordinator-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: AWS_REGION
        value: us-east-1
      - key: BEDROCK_MODEL_ID
        value: openai.gpt-oss-120b-1:0
      - key: AWS_BEARER_TOKEN_BEDROCK
        sync: false

  - type: web
    name: care-coordinator-app
    runtime: static
    rootDir: frontend
    buildCommand: echo "static site, no build step"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
